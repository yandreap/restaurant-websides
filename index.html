<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Yina Andrea &mdash; Websites for Houston restaurants</title>
<meta name="description" content="Simple websites for Houston restaurants: the menu, the hours, and how to get there.">
<meta name="theme-color" content="#0c0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230c0a09'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='%23c2622c' font-family='Georgia,serif'%3EY%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#0c0a09;--bone:#f6f1e8;--acento:#c2622c;
  --line:rgba(246,241,232,.14);--dim:rgba(246,241,232,.62);
  --display:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--bone);font-family:var(--sans);font-weight:300;
  font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  min-height:100svh;display:flex;align-items:center;padding:40px 24px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
.wrap{width:100%;max-width:640px;margin-inline:auto}
.eyebrow{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--acento);font-weight:500}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,8vw,68px);
  line-height:1.05;letter-spacing:-.02em;margin:16px 0 22px}
p{color:var(--dim);max-width:46ch}
.acciones{margin-top:36px;display:flex;flex-wrap:wrap;gap:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;
  padding:0 30px;border:1px solid var(--acento);border-radius:999px;background:var(--acento);
  color:#fff;font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  transition:transform .4s cubic-bezier(.22,.61,.36,1),filter .3s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
.btn--g{background:transparent;border-color:var(--line);color:var(--bone)}
.btn--g:hover{background:rgba(246,241,232,.09);filter:none}
.pie{margin-top:52px;padding-top:26px;border-top:1px solid var(--line);
  font-size:14px;color:var(--dim)}
.pie b{color:var(--bone);font-weight:400}
@media(max-width:520px){.acciones .btn{width:100%}}
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Houston, Texas</p>
    <h1>Websites for<br>restaurants.</h1>
    <p>I spent five years working restaurant floors. Now I build simple websites:
    the menu, the hours, and how to get there &mdash; so people can find you
    before they decide where to eat.</p>
    <div class="acciones">
      <a class="btn" href="tel:+18328191135">Call me &mdash; (832) 819-1135</a>
    </div>
    <p class="pie"><b>Yina Andrea</b><br>Houston, TX &middot; (832) 819&ndash;1135</p>
  </main>
</body>
</html>
